name: validate

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly check against the newest Claude Code release, so plugin-API
    # changes show up as a failed workflow instead of a silently missing band.
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code@latest

      - name: Validate plugin and marketplace
        run: claude plugin validate .
