<svg xmlns="http://www.w3.org/2000/svg" width="960" height="104" viewBox="0 0 960 104" role="img" aria-label="token-speed preview: 360.1 t/s, 76% of the 60-minute peak">
  <defs>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3AA99A" stop-opacity=".22"/>
      <stop offset="100%" stop-color="#3AA99A" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="5" flood-color="#000" flood-opacity=".06"/>
    </filter>
  </defs>

  <rect width="960" height="104" fill="#f3f3f5"/>

  <!-- status band -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'PingFang SC', sans-serif" font-size="13">
    <path d="M270 10 L261 22 L267 22 L266 30 L276 17 L270 17 Z" fill="#3AA99A"/>
    <text x="315" y="28" text-anchor="end" fill="#3AA99A" font-weight="650">360.1</text>
    <text x="323" y="28" fill="#8a8a8e">t/s</text>
    <text x="346" y="28" fill="#8a8a8e" font-size="11">· 76% of 472</text>

    <g transform="translate(420,8)">
      <path d="M2 20 C 14 18, 22 9, 36 12 S 58 6, 72 14 S 96 4, 112 10 S 134 15, 148 9 S 170 16, 186 11 S 204 7, 218 12 L 218 24 L 2 24 Z" fill="url(#area)"/>
      <path d="M2 20 C 14 18, 22 9, 36 12 S 58 6, 72 14 S 96 4, 112 10 S 134 15, 148 9 S 170 16, 186 11 S 204 7, 218 12" fill="none" stroke="#3AA99A" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="218" cy="12" r="3.2" fill="none" stroke="#3AA99A" stroke-width="1.4"/>
      <circle cx="218" cy="12" r="1.3" fill="#3AA99A"/>
    </g>

    <text x="696" y="28" text-anchor="end" fill="#6e6e73">◎ 87%</text>
    <text x="872" y="28" text-anchor="end" fill="#6e6e73">[██████░░░░] 42%</text>
    <text x="918" y="28" text-anchor="end" fill="#8a8a8e">01:23</text>
  </g>

  <!-- prompt box -->
  <rect x="40" y="46" width="880" height="42" rx="15" fill="#ffffff" stroke="#d9d9df" filter="url(#shadow)"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'PingFang SC', sans-serif">
    <text x="62" y="74" fill="#3a3a3c" font-size="22" font-weight="300">+</text>
    <text x="90" y="73" fill="#9a9aa0" font-size="14">Type / for commands</text>
